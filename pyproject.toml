[project]
name = "pupulinbot"
version = "0.1.0"
description = "A NoneBot2 QQ bot for Mahjong Soul records and Mortal reviews"
requires-python = ">=3.11"
dependencies = [
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "nonebot-plugin-apscheduler>=0.5,<1",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.4,<3",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
